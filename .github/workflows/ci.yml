name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ── Lint: ruff + pre-commit (hadolint, yamllint, shellcheck, markdownlint) ──
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group lint

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: pre-commit (hadolint, yamllint, shellcheck, markdownlint)
        run: uv run pre-commit run --all-files

  # ── Type check: mypy strict ──
  type-check:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group type-check

      - name: mypy src/
        run: uv run mypy src/

  # ── Fast tests: unit + integration (no model, no Docker) ──
  test-fast:
    name: Tests (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group test

      - name: Run fast tests
        run: uv run pytest -m "not slow and not non_regression" --tb=short -q

  # ── Non-regression tests: Docker-dependent security/contract checks ──
  test-non-regression:
    name: Tests (non-regression)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group test

      - name: Pre-pull Docker images for compose_stack fixture
        run: |
          docker pull caddy:2-alpine
          docker pull nginx:alpine

      - name: Run non-regression tests
        run: uv run pytest -m non_regression tests/test_non_regression/ -v --tb=short

      - name: Enforce grep invariant
        run: |
          leaks=$(grep -rl "pytest.mark.non_regression" tests/ | grep -v "test_non_regression/" || true)
          if [ -n "$leaks" ]; then
            echo "ERROR: non_regression marker found outside tests/test_non_regression/:"
            echo "$leaks"
            exit 1
          fi
          echo "Grep invariant OK: no non_regression tests outside test_non_regression/"

      - name: Teardown non-regression containers
        if: always()
        run: |
          ids=$(docker ps -aq --filter label=compadre-non-regression 2>/dev/null || true)
          if [ -n "$ids" ]; then docker rm -f $ids 2>/dev/null || true; fi
          docker network rm compadre-non-regression-net 2>/dev/null || true

  # ── Ansible lint: playbook + YAML validation ──
  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group ci

      - name: ansible-lint
        run: uv run ansible-lint deploy/ansible/playbooks/

      - name: yamllint
        run: uv run yamllint deploy/ansible/

  # ── Docker build: verify image compiles ──
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (build only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: compadre-ci

  # ── Coverage: run tests with coverage collection ──
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test-fast]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group test

      - name: Run tests with coverage
        run: |
          uv run coverage run -m pytest -m "not slow and not non_regression" --tb=short -q

      - name: Coverage report
        run: |
          uv run coverage report --fail-under=60

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            .coverage
            htmlcov/
          retention-days: 7
