---
# Compadre Whisper Model Deployment Playbook
# Pre-seeds the faster-whisper large-v3-turbo model (~1.5 GB) in the
# compadre-models Docker volume before the service starts. Without this
# playbook the model auto-downloads on first container start (delaying
# initial readiness by 1-2 minutes on a 100 Mbps link); running this
# playbook BEFORE bootstrap.yml means the service starts with the model
# already cached.
#
#   ansible-playbook playbooks/deploy-models.yml -i inventory/production.yml
#
# Mode B (one-shot download trigger) — the only mode implemented in MVP.
# Runs a temporary ``docker compose run`` container that invokes
# ``ensure_whisper_model()`` from ``src/compadre/download.py``, which
# calls ``huggingface_hub.snapshot_download`` to pull the model from
# HuggingFace Hub into the compadre-models volume. The temp container is
# removed automatically (--rm).
#
# Mode A (air-gapped pre-seed via SCP from operator's local HF cache)
# is documented as future work below. For now, air-gapped deployments
# should run this playbook on a build host with internet access and then
# rsync the compadre-models volume contents to the air-gapped VPS.
#
# Entirely unprivileged — no become: true.

- name: Pre-seed Whisper Model Cache
  hosts: compadre_vps
  gather_facts: true

  tasks:
    # =========================================================================
    # Prerequisites
    # =========================================================================

    - name: "[Prereq] Check Compadre directory exists"
      ansible.builtin.stat:
        path: "~/compadre"
      register: compadre_dir

    - name: "[Prereq] Verify Compadre is deployed"
      ansible.builtin.assert:
        that:
          - compadre_dir.stat.exists
          - compadre_dir.stat.isdir
        fail_msg: >-
          ~/compadre directory does not exist.
          Run bootstrap.yml first to deploy the service.
        success_msg: "Compadre directory found."

    # =========================================================================
    # Model Cache Directory (idempotent — needed before download)
    # =========================================================================

    - name: "[Models] Ensure model cache directory exists in volume"
      block:
        - name: "[Models] Create helper container for volume access"
          community.docker.docker_container:
            name: compadre-volume-helper
            image: alpine:3.21
            command: "sh -c 'mkdir -p /models/hub'"
            volumes:
              - "compadre-models:/models"
            state: started
            auto_remove: false

        - name: "[Models] Wait for container to finish"
          community.docker.docker_container_info:
            name: compadre-volume-helper
          register: helper_info
          until: >-
            not (helper_info.container.State.Running | default(false))
          retries: 10
          delay: 1

      always:
        - name: "[Models] Remove helper container"
          community.docker.docker_container:
            name: compadre-volume-helper
            state: absent

    # =========================================================================
    # Mode B — One-shot download trigger
    # =========================================================================
    # Runs ``docker compose run --rm`` with the compadre-stt service
    # definition. The container inherits the env block from compose.yaml
    # (including HF_HOME → /app/models) and mounts the compadre-models
    # volume at /app/models. The ``--rm`` flag removes the container after
    # the command completes.
    #
    # The download function in ``src/compadre/download.py`` calls
    # ``huggingface_hub.snapshot_download`` for the
    # ``mobiuslabsgmbh/faster-whisper-large-v3-turbo`` repo (~1.5 GB).
    # If the model is already cached the function is a no-op (Hub client
    # checks local cache before downloading).

    - name: "[Download] Trigger Whisper model download via compose run"
      ansible.builtin.command:
        cmd: >-
          docker compose -f ~/compadre/compose.yaml run --rm
        --entrypoint python
        compadre-stt
        -c
        "from compadre.download import ensure_whisper_model; ensure_whisper_model()"
        chdir: "~/compadre"
      register: download_result
      changed_when: "'already' not in (download_result.stdout | default('') | lower)"

    # =========================================================================
    # Verify
    # =========================================================================

    - name: "[Verify] List model cache contents"
      ansible.builtin.command:
        cmd: >-
          docker compose -f ~/compadre/compose.yaml run --rm
        --entrypoint ls
        compadre-stt
        -la /app/models/hub/
        chdir: "~/compadre"
      register: cache_listing
      changed_when: false
      failed_when: false

    # =========================================================================
    # Summary
    # =========================================================================

    - name: "[Summary] Report model cache status"
      ansible.builtin.debug:
        msg: |
          ============================================
          Compadre — Whisper Model Cache Pre-seeded
          ============================================

          Model:          large-v3-turbo (~1.5 GB, int8 quantized)
          Repo:           mobiuslabsgmbh/faster-whisper-large-v3-turbo
          Cache volume:   compadre-models → /app/models
          HF_HOME:        /app/models

          Cache contents:
          {{ cache_listing.stdout | default('(unable to list — container may need image build first)') }}

          After bootstrap, verify the model is loaded:
            curl -k https://{{ ansible_host }}/health
            # → {"status": "healthy", "models": ["large-v3-turbo"]}

          To force a fresh download:
            docker compose exec compadre-stt rm -rf /app/models/hub
            docker compose restart compadre-stt

          ============================================

    # =========================================================================
    # Mode A — Air-gapped pre-seed from operator's local HF cache (future work)
    # =========================================================================
    # For air-gapped deployments where the VPS has no outbound internet:
    #
    # 1. On a build host with internet access, run:
    #      pip install huggingface_hub
    #      python -c "
    #      from huggingface_hub import snapshot_download
    #      snapshot_download('mobiuslabsgmbh/faster-whisper-large-v3-turbo',
    #                        cache_dir='./hf-cache')
    #      "
    #
    # 2. Compress and SCP the cache to the VPS:
    #      tar -czf whisper-cache.tar.gz -C hf-cache .
    #      scp whisper-cache.tar.gz galvani@<vps>:~/
    #
    # 3. On the VPS, extract into the compadre-models volume:
    #      docker compose -f ~/compadre/compose.yaml run --rm
    #        -v ~/whisper-cache.tar.gz:/tmp/cache.tar.gz:ro
    #        compadre-stt bash -c
    #        'tar -xzf /tmp/cache.tar.gz -C /app/models/hub/'
    #
    # The directory structure inside /app/models/hub/ must match what
    # huggingface_hub expects: a ``models--mobiuslabsgmbh--faster-whisper-large-v3-turbo``
    # directory with ``snapshots/`` and ``refs/`` subdirectories.
